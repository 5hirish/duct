[package]
name = "desktop"
version = "0.4.0"
description = "Duct desktop shell"
authors = ["Duct"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["updater", "crash-reporting"]
# Self-update, on everywhere except the Mac App Store — where shipping it is
# grounds for rejection. That build is produced with `--no-default-features`,
# which drops the plugin AND the `autoUpdate` capability the web app gates its
# update UI on, so the two can never disagree.
updater = ["dep:tauri-plugin-updater"]
# Crash reporting, on by default and compiled out when the DSN is absent
# anyway. Separable so a build can drop the dependency entirely.
crash-reporting = ["dep:sentry"]
# Webview inspector in a release build. Off by default; debug builds get it
# regardless. Passed through so `View → Toggle Developer Tools` and Tauri's own
# `open_devtools` are compiled in together — gating them on different flags is
# how you get a menu item that does nothing.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Custom URL scheme (ai.getduct.desktop://) for the browser-based OAuth
# return leg. Scheme registration lands in the bundle's Info.plist; no
# extra sandbox entitlements needed (unlike a localhost listener).
tauri-plugin-deep-link = "2"
# System notifications for "the agent is done / needs you" while the window is
# in the background. Reached through the `notify` command, not the plugin's JS
# bindings — the window loads a remote origin (see `notify` in lib.rs).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS keychain for bring-your-own provider keys: macOS Keychain, Windows
# Credential Manager, Linux Secret Service (libsecret via D-Bus).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# The sidecar encrypts stored connector credentials with a Fernet key, and the
# frozen bundle ships no `.env` to put one in. The shell mints it on first run
# and keeps it in the same keychain as the provider keys — see
# `credentials_encryption_key` in lib.rs. Fernet's key format is exactly
# url-safe base64 of 32 random bytes, which is all these two are for.
base64 = "0.23"
getrandom = "0.4"
# Self-update for the Developer ID / NSIS / AppImage channels. Allowed here
# because none of them is the Mac App Store, where self-update is grounds for
# rejection — the appstore overlay must never enable it.
tauri-plugin-updater = { version = "2", optional = true }
# Crash reporting for the shell itself. rustls rather than the default
# native-tls: the bundle already links rustls through the updater, and adding
# OpenSSL would mean another library to sign and notarize on macOS.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
], optional = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# macOS routes a deep link to the already-running app; Windows and Linux instead
# launch a SECOND process with the URL in argv. For this app that would mean a
# second window and a second sidecar, with the auth code delivered to the wrong
# one. Single-instance forwards argv to the running instance instead.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
