<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duct</title>
    <!--
      Everything is inline, and that is the whole design constraint.

      This window exists to put pixels on screen before the network resolves,
      so it must paint from a single document with zero subresources: no
      stylesheet request, no script request, no font file, no image. A remote
      font alone would reintroduce the wait this window was built to hide.
      The four brand tokens are copied from site/assets/duct.css rather than
      imported, for the same reason. Keep them in step by hand; there are four.
    -->
    <style>
      :root {
        --orange: #ff5c00;
        --navy: #0d0f1a;
        --navy-3: #6b6f82;
        --off: #f7f7f6;
        --track: #e6e6e4;
        --serif: Georgia, "Times New Roman", Times, serif;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --navy: #f4f4f3;
          --navy-3: #8b8fa0;
          --off: #14161f;
          --track: #272a36;
        }
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--off);
        color: var(--navy);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      .splash {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* No title bar to grab, so the whole panel is the drag handle. */
        -webkit-app-region: drag;
      }

      /* The logo is the site's, unchanged: serif wordmark, orange dot, and the
         2.5s pop that is the brand's signature motion. */
      .logo {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: var(--serif);
        font-size: 30px;
        letter-spacing: -0.3px;
        line-height: 1;
      }

      .logo-mark {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--orange);
        animation: pop 2.5s ease-in-out infinite;
      }

      @keyframes pop {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.35);
        }
      }

      /* The duct the dot runs through. A hairline, because this is a two-second
         moment and a chunky bar would be the loudest thing on screen. */
      .track {
        margin-top: 18px;
        width: 160px;
        height: 2px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
      }

      .fill {
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: var(--orange);
        /* Matches the 100ms trickle tick, so motion is continuous rather than
           a visible staircase. */
        transition: width 0.1s linear;
      }

      /* Reserved at a fixed height, and occupied from the first frame. The
         height is what stops the 8s message shifting the layout; keeping a
         line in it the whole time is what stops that message *appearing*,
         which is one less event during the wait it is reporting on.

         Absolutely positioned, so `left`/`right` size the box and only
         `text-align` actually centres the text. */
      .status {
        position: absolute;
        bottom: 16px;
        left: 0;
        right: 0;
        margin: 0;
        padding: 0 20px;
        height: 16px;
        text-align: center;
        font-size: 12px;
        line-height: 16px;
        color: var(--navy-3);
        transition: opacity 0.22s ease;
      }

      /* First run only. The greeting is built by script rather than written
         here so that a normal launch never references salve.webp at all: a
         hidden <img> is still a decode this window cannot afford. */
      .panel {
        width: 128px;
        height: 128px;
        margin-bottom: 16px;
        border-radius: 3px;
        display: block;
        /* Fades rather than snapping, so a slow decode never flashes. */
        animation: settle 0.5s ease both;
      }

      @keyframes settle {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .line {
        margin: 10px 0 0;
        padding: 0 28px;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--navy-3);
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-mark {
          animation: none;
        }
        /* An indicator whose only content is motion says nothing once the
           motion is gone, so drop it and let the words do the work. */
        .track {
          display: none;
        }
        .panel {
          animation: none;
        }
        .status {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="splash">
      <span id="panel-slot"></span>
      <p class="logo"><span>Duct</span><span class="logo-mark"></span></p>
      <span id="line-slot"></span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <p class="status" id="status"></p>
    </main>

    <script>
      const CEILING = 92;
      const TICK_MS = 100;
      // 0.045 reached ~91% by nine seconds, which is a bar that has visibly
      // given up while the app is still coming. 0.01 keeps it moving for the
      // whole plausible range of waits without ever looking nearly done.
      const EASE = 0.01;

      // Long enough that a normal start never shows it, short enough that a
      // stalled one does not feel ignored. Measured normal case is ~5.5s on a
      // loaded machine, so 8s means "this is no longer normal".
      const SLOW_AFTER_MS = 8000;
      const SLOW_MESSAGE = "Still connecting. Check your network.";

      // Rust decides this, because the window size depends on it and the size
      // is fixed before the webview exists — the page cannot be what reads it.
      // The query string is the same switch for opening this file straight in
      // a browser, which is the only way to review it without a build.
      const FIRST_RUN =
        window.__DUCT_FIRST_RUN__ === true ||
        new URLSearchParams(location.search).get("first") === "1";

      // Aqueduct lines, because the product is named after one. Each is one
      // line at 380px (measured, widest 291px of 340px available) and each
      // turns back on the wait itself, so it reads as a remark about right now
      // rather than as trivia. A fact you have to stop and read is worse than
      // silence in a window that lives two seconds.
      const ROTATE_MS = 3200;
      const FADE_MS = 220;
      const QUIPS = [
        "Aqua Claudia: 69 km, all downhill.",
        "Eleven aqueducts fed Rome. You have one.",
        "Aqua Virgo, 19 BC. Still running today.",
        "The Pont du Gard drops 2.5 cm over 456 m.",
        "Segovia's aqueduct was built without mortar.",
        "No pumps in Rome. Gravity and patience.",
        "34 cm of fall per kilometre. Precise work.",
        "Rome measured water in quinariae. We prefer rows.",
        "Frontinus audited the water. You audit the spend.",
      ];

      const fill = document.getElementById("fill");
      const status = document.getElementById("status");
      const stillness = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // A trickle, not a progress bar: this window has no way to know how the
      // hosted app's load is going, and inventing a percentage would be a lie
      // told to the one person who can tell it is a lie.
      //
      // What it does honestly is decay toward a ceiling it never reaches, so
      // the bar always moves, never stalls at zero, and never sits full while
      // the user waits. The shell closes this window the moment the app is
      // ready, which is almost always before the bar gets far — so the usual
      // experience is an indicator cut off early, which reads as arriving
      // sooner than promised rather than as a wait that ended.
      //
      // Start ahead of zero. An indicator that sits at nothing for its first
      // frame reads as a hang, and this is the frame the user actually sees.
      let progress = 6;
      fill.style.width = progress + "%";

      setInterval(() => {
        progress += (CEILING - progress) * EASE;
        fill.style.width = progress + "%";
      }, TICK_MS);

      let rotation = null;

      if (FIRST_RUN) {
        // The one arrival that can afford an illustration. app/DESIGN.md: a
        // panel goes where someone arrives, and the rarer the surface the more
        // it can afford — this surface is seen once per install, and `salve`
        // is the threshold panel drawn for exactly this moment.
        const panel = document.createElement("img");
        panel.className = "panel";
        panel.src = "salve.webp";
        panel.alt = "";
        document.getElementById("panel-slot").replaceWith(panel);

        const line = document.createElement("p");
        line.className = "line";
        line.textContent = "Your ads, analytics and revenue, read together.";
        document.getElementById("line-slot").replaceWith(line);

        // No quips here. The greeting is already the content budget for this
        // window, and two things to read is how a short wait starts feeling
        // long.
      } else {
        // Random start, so two launches in a row are not the same line twice.
        let i = Math.floor(Math.random() * QUIPS.length);
        status.textContent = QUIPS[i];

        // Rotation is decoration and the 8s message is information, so
        // reduced motion drops the first and keeps the second.
        if (!stillness) {
          rotation = setInterval(() => {
            status.style.opacity = "0";
            setTimeout(() => {
              i = (i + 1) % QUIPS.length;
              status.textContent = QUIPS[i];
              status.style.opacity = "1";
            }, FADE_MS);
          }, ROTATE_MS);
        }
      }

      setTimeout(() => {
        // Past here something is actually wrong, so stop being funny. A quip
        // sitting on top of a real failure is the part people resent.
        if (rotation) clearInterval(rotation);
        status.style.opacity = "0";
        setTimeout(() => {
          status.textContent = SLOW_MESSAGE;
          status.style.opacity = "1";
        }, FADE_MS);
      }, SLOW_AFTER_MS);
    </script>
  </body>
</html>
