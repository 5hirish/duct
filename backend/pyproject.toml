[tool.poetry]
name = "duct-backend"
version = "0.1.0"
description = "Duct reporting backend"
packages = [{ include = "briefs" }, { include = "scripts" }]

[tool.poetry.dependencies]
# google-ads is not yet compatible with Python 3.13+
python = ">=3.11,<3.13"
fastapi = "^0.111"
uvicorn = { version = "^0.29", extras = ["standard"] }
google-ads = "^24.0"
google-genai = "^1.0"
python-dotenv = "^1.0"
pydantic = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.6.9"

[tool.pytest.ini_options]
filterwarnings = [
    # Starlette form parser; third-party until FastAPI/Starlette adopts python_multipart import.
    "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
