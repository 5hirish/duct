[project]
name = "duct-backend"
version = "0.1.0"
description = "Duct reporting backend"
# Minimum 3.12 for project standard; <3.14 keeps supported set to 3.12–3.13 (CI uses 3.12).
requires-python = ">=3.12,<3.14"
# Dependencies stay in [tool.poetry.dependencies] (Poetry's caret syntax); declared
# dynamic so Poetry sources them from there under PEP 621 metadata.
dynamic = ["dependencies"]

[tool.poetry]
packages = [
    { include = "agents" },
    { include = "db" },
    { include = "models" },
    { include = "routes" },
    { include = "service" },
    { include = "utils" },
]

[tool.poetry.dependencies]
fastapi = "^0.135"
uvicorn = {version = "^0.49", extras = ["standard"]}
google-ads = "^31.4"
google-analytics-data = "^0.23"
google-api-python-client = "^2.179.0"
google-genai = "^2.8"
python-dotenv = "^1.0"
pydantic = "^2.12"
pydantic-settings = "^2.12"
langchain = "^1.0"
langchain-openai = "^1.0"
langchain-google-genai = "^4.2"
langchain-anthropic = "^1.4"
langgraph = "^1.1"
pyjwt = "^2.8"
httpx = "^0.28"
# Cloudflare R2 image storage over the S3 API (service/storage.py). Only loaded
# when the 'r2' storage backend is active.
boto3 = "^1.35"
sqlmodel = "^0.0.38"
alembic = "^1.17"
psycopg = {version = "^3.2", extras = ["binary"]}
sentry-sdk = "^2.57.0"
dlt = "^1.17.1"
claude-agent-sdk = ">=0.2"
selectolax = ">=0.3"
extruct = ">=0.16"
trafilatura = ">=2.0"
deepagents = "0.7.11"   # exact: 0.x with no stability policy; changes behaviour in minors (task planning became opt-in in 0.7). tests/test_deepagents_harness.py is the upgrade gate.
# OTel GenAI spans for the LangChain (v1) path — v3 gets tracing from the
# Claude Agent SDK, v1 does not. The API only; an exporter is configured at
# runtime (Sentry OTLP today). Declared explicitly because it used to arrive
# transitively via google-adk, which has since been removed with the v2 engine.
opentelemetry-api = "^1.41"
reportlab = ">=4.2"
cloudflare = ">=4.1"
# Durable conversation state (agents/core/checkpoint.py). Both, not one: the
# same app serves Postgres on Railway and SQLite in the desktop sidecar, and the
# checkpointer follows DATABASE_URL rather than forcing a database of its own.
# Separate distributions from `langgraph` itself, and MIT like it — unlike
# `langgraph-api` (the Platform server, Elastic-2.0), which Duct does not use:
# the library runs in-process inside FastAPI, with our own SSE transport.
langgraph-checkpoint-postgres = "^3.1"
langgraph-checkpoint-sqlite = "^3.1"
# OpenRouter's first-party LangChain integration — `init_chat_model(
# model_provider="openrouter")` resolves to it. Duct never imports it directly;
# LangChain does, which is why no agents/ file gains a framework import and the
# harness-boundary allowlist is untouched.
#
# It replaced ChatOpenAI-pointed-at-their-base-URL, which worked but had nowhere
# to put OpenRouter's own surface: `openrouter_provider` routing preferences,
# the unified `reasoning` object, data-collection controls, app attribution.
#
# Two things to know before using more of it. It does NOT depend on
# langchain-openai — it brings its own `openrouter` SDK, so this is a real
# second client, not a wrapper. And `route=` / `n>1` are declared fields that
# raise TypeError before any network I/O, because the underlying SDK's
# `Chat.send()` has no such parameters (langchain-ai/langchain#39180, closed
# `not planned`). Express failover through `openrouter_provider` instead, and
# do not reach for `route`.
langchain-openrouter = "^0.2.8"

[tool.poetry.group.dev.dependencies]
pytest = "^9"
pytest-asyncio = "^1.0"
ruff = "^0.16"
arize-phoenix = "^17.7.0"
pyinstaller = "^6.11"
# In-memory span exporter for tests/test_telemetry.py.
opentelemetry-sdk = "^1.41"

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s  %(name)-35s  %(levelname)-7s  %(message)s"
log_cli_date_format = "%H:%M:%S"
markers = [
    "live: live end-to-end tests requiring API keys (ANTHROPIC_API_KEY + DATABASE_URL).",
]
# `live` tests spend real money (model calls, image generation) and hit real
# third-party accounts. Deselect them by default so neither CI nor a developer
# with keys exported in their shell can fire them by typing `pytest`. Opt in
# explicitly with `pytest -m live` — a command-line -m overrides this one.
addopts = ["-m", "not live"]
filterwarnings = [
    # Starlette form parser; third-party until FastAPI/Starlette adopts python_multipart import.
    "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
