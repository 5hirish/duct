<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!-- Every asset reference here is root-absolute on purpose. Cloudflare Pages serves
     this file at the URL that missed, so a relative "assets/duct.css" resolves to
     /blog/assets/duct.css on /blog/anything and the page renders unstyled. -->
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/assets/apple-icon.svg"/>
<title>Page not found — Duct</title>
<meta name="robots" content="noindex, follow"/>
<meta name="description" content="Nothing on getduct.ai matches that URL. Head back to the homepage, or jump straight to the Duct blog, the free marketing tools, or the product changelog."/>
<link rel="stylesheet" href="/assets/duct.css"/>
<script src="/assets/config.js" defer></script>
<style>
/* Local to this page: the "we looked and found nothing" red. Not a brand token —
   nothing else on the site reports a miss. */
:root { --miss: #c0392b; }

/* Scope every rule under .error-page and give the numeral its own class rather
   than styling a bare element. A page-wide `.error-page p` used to outrank
   `.error-code`, which rendered "404" at 16px with -5px tracking — three digits
   collapsed into an unreadable smudge. */
.error-page {
  min-height: calc(100vh - 62px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 118px 24px 88px;
}
.error-inner {
  width: 100%;
  max-width: 620px;
  text-align: center;
}
.error-page .error-code {
  font-family: var(--serif);
  font-size: clamp(76px, 15vw, 132px);
  line-height: .9;
  letter-spacing: -5px;
  color: var(--border);
  user-select: none;
}
.error-page h1 {
  font-family: var(--serif);
  font-size: clamp(28px, 4.4vw, 42px);
  line-height: 1.14;
  letter-spacing: -1px;
  color: var(--navy);
  margin: 18px 0 14px;
  animation: none;
}
.error-page .error-lede {
  font-size: 16px;
  font-weight: 300;
  color: var(--navy-3);
  line-height: 1.7;
  max-width: 420px;
  margin: 0 auto 32px;
}

/* The diagnostic card reads as a miniature Duct report: a scan that ran,
   found nothing, and still ends with a recommendation. */

.error-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 26px;
}
/* A 404 should route people somewhere, not just bounce them home. */
.error-elsewhere {
  font-size: 13px;
  color: var(--navy-3);
}
.error-elsewhere a {
  color: var(--navy-3);
  text-decoration: none;
  border-bottom: 1px solid var(--border);
  padding-bottom: 1px;
  transition: color .15s, border-color .15s;
}
.error-elsewhere a:hover { color: var(--navy); border-color: var(--navy); }
.error-elsewhere .sep { padding: 0 8px; opacity: .45; }

@media (max-width: 600px) {
  .error-page { padding: 96px 20px 64px; }
  .error-actions .btn { width: 100%; }
  .error-elsewhere .sep { padding: 0 5px; }
}
.error-art { margin: 36px auto 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.error-art .mosaic { width: 260px; height: 260px; }
.error-art figcaption { font-size: 13px; color: var(--navy-3); font-family: var(--serif); font-style: italic; }
.error-art figcaption em { font-style: normal; color: var(--navy); letter-spacing: .08em; }
</style>
</head>
<body>

<!-- NAV (shared: site/partials/nav-simple.html) -->
<div data-duct-partial="/partials/nav-simple.html"></div>

<main class="error-page">
 <div class="error-inner">

  <div class="error-code" aria-hidden="true">404</div>

  <h1>Your tools have the answer.<br/><em>This page doesn't.</em></h1>

  <p class="error-lede">We checked every connected source. Zero results. The URL you're after hasn't been indexed, shipped, or synthesised — yet.</p>

  <figure class="error-art">
    <img class="mosaic" src="/assets/art/cdiv.webp" width="640" height="640" alt="" aria-hidden="true"/>
    <figcaption><em>CDIV.</em> A Roman road ends at a milestone. So does this one.</figcaption>
  </figure>

  <div class="error-actions">
    <a href="/" class="btn btn-orange btn-lg">Back to home &rarr;</a>
    <a href="/blog/" class="btn btn-ghost btn-lg">Read the blog</a>
  </div>

  <p class="error-elsewhere">
    <a href="/tools/">Free tools</a><span class="sep">·</span><a href="/changelog/">Changelog</a><span class="sep">·</span><a href="/about">About Duct</a>
  </p>

 </div>
</main>

<!-- FOOTER (shared: site/partials/footer-expanded.html) -->
<div data-duct-partial="/partials/footer-expanded.html"><div class="legal-fallback"><a href="/">Duct</a><a href="/about">About</a><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Service</a></div></div>

<script src="/assets/duct-partials.js"></script>
<script src="/assets/duct.js" defer></script>
<script src="/assets/duct-download.js" defer></script>

</body>
</html>
