<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
  <title id="t">Seven agent jobs across one working week</title>
  <desc id="d">A Monday to Friday timeline. Monday: the cross-tool read, marked in orange as the job to try first. Tuesday: trace a drop across tools, whenever it happens. Wednesday: find pages ranking without clicks, and propose a budget move. Thursday: audit one page, and plan the week's posts. Friday: check whether last week's fix worked. Under the timeline a note says every job reads at least two tools and only two of the seven end in a proposed change.</desc>
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .day { font-size: 20px; font-weight: bold; fill: #0d0f1a; }
      .jobb { font-size: 19px; font-weight: bold; fill: #0d0f1a; }
      .tools { font-size: 16px; fill: #4b5068; }
      .k { font-size: 15px; font-weight: bold; letter-spacing: 2.5px; fill: #ff5c00; }
      .note { font-size: 17px; fill: #4b5068; }
    </style>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="20" y="44" class="serif" font-size="32" fill="#0d0f1a">Seven jobs, one week</text>
  <text x="20" y="76" class="sans" font-size="19" fill="#4b5068">Where each job lands in a small team's week, and the one to try first.</text>

  <g class="sans day" text-anchor="middle">
    <text x="118" y="122">Monday</text>
    <text x="310" y="122">Tuesday</text>
    <text x="502" y="122">Wednesday</text>
    <text x="694" y="122">Thursday</text>
    <text x="886" y="122">Friday</text>
  </g>
  <line x1="20" y1="138" x2="980" y2="138" stroke="#d9dbe3" stroke-width="2"/>
  <g stroke="#eef0f5" stroke-width="2">
    <line x1="214" y1="138" x2="214" y2="500"/>
    <line x1="406" y1="138" x2="406" y2="500"/>
    <line x1="598" y1="138" x2="598" y2="500"/>
    <line x1="790" y1="138" x2="790" y2="500"/>
  </g>

  <!-- Monday -->
  <rect x="30" y="158" width="176" height="152" rx="12" fill="#fff3ea" stroke="#ff5c00" stroke-width="3"/>
  <text x="46" y="186" class="sans k">TRY FIRST</text>
  <text x="46" y="216" class="sans jobb">1. The Monday</text>
  <text x="46" y="240" class="sans jobb">read</text>
  <text x="46" y="270" class="sans tools">GA4 · Search</text>
  <text x="46" y="292" class="sans tools">Console · Ads</text>

  <!-- Tuesday -->
  <rect x="222" y="158" width="176" height="152" rx="12" fill="#ffffff" stroke="#d9dbe3" stroke-width="2"/>
  <text x="238" y="200" class="sans jobb">2. Why did it</text>
  <text x="238" y="224" class="sans jobb">drop?</text>
  <text x="238" y="254" class="sans tools">GA4 · Clarity</text>
  <text x="238" y="276" class="sans tools">GitHub · any day</text>

  <!-- Wednesday -->
  <rect x="414" y="158" width="176" height="152" rx="12" fill="#ffffff" stroke="#d9dbe3" stroke-width="2"/>
  <text x="430" y="200" class="sans jobb">3. Ranking</text>
  <text x="430" y="224" class="sans jobb">without clicks</text>
  <text x="430" y="254" class="sans tools">Search Console · GA4</text>

  <rect x="414" y="330" width="176" height="152" rx="12" fill="#ffffff" stroke="#d9dbe3" stroke-width="2"/>
  <text x="430" y="372" class="sans jobb">4. Move the</text>
  <text x="430" y="396" class="sans jobb">budget</text>
  <text x="430" y="426" class="sans tools">Ads · GA4 · Stripe</text>
  <text x="430" y="448" class="sans tools" fill="#c2410c">proposes a change</text>

  <!-- Thursday -->
  <rect x="606" y="158" width="176" height="152" rx="12" fill="#ffffff" stroke="#d9dbe3" stroke-width="2"/>
  <text x="622" y="200" class="sans jobb">5. Audit one</text>
  <text x="622" y="224" class="sans jobb">page</text>
  <text x="622" y="254" class="sans tools">Crawl · Search</text>
  <text x="622" y="276" class="sans tools">Console · GA4</text>

  <rect x="606" y="330" width="176" height="152" rx="12" fill="#ffffff" stroke="#d9dbe3" stroke-width="2"/>
  <text x="622" y="372" class="sans jobb">6. Plan the</text>
  <text x="622" y="396" class="sans jobb">week's posts</text>
  <text x="622" y="426" class="sans tools">Project memory</text>

  <!-- Friday -->
  <rect x="798" y="158" width="176" height="152" rx="12" fill="#ffffff" stroke="#d9dbe3" stroke-width="2"/>
  <text x="814" y="200" class="sans jobb">7. Did last</text>
  <text x="814" y="224" class="sans jobb">week's fix work?</text>
  <text x="814" y="254" class="sans tools">GA4 · GitHub</text>
  <text x="814" y="276" class="sans tools">memory</text>
  <text x="814" y="298" class="sans tools" fill="#c2410c">may roll back</text>

  <line x1="20" y1="518" x2="980" y2="518" stroke="#d9dbe3" stroke-width="2"/>
  <text x="20" y="552" class="sans note">Every job reads at least two tools. Two of the seven end in a proposed change, and a person applies it.</text>
  <text x="20" y="578" class="sans note">The rest end in a brief you read in two minutes instead of five tabs.</text>
</svg>
