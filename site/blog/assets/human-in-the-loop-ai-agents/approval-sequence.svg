<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="t d">
  <title id="t">Where a person sits in a staged change</title>
  <desc id="d">The agent proposes a change set. A policy in code checks every change. If all changes are allowlisted, reversible and the project allows it, the set applies with an undo. Otherwise a person decides: approve applies the set, reject ends it. Any applied set can be rolled back. The agent has no path to apply.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5068"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff5c00"/></marker>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .h { font-size: 23px; font-weight: bold; fill: #0d0f1a; }
      .l { font-size: 19px; fill: #4b5068; }
      .s { font-size: 19px; fill: #4b5068; }
      .k { font-size: 15px; font-weight: bold; letter-spacing: 2.5px; fill: #ff5c00; }
      .flow { stroke: #4b5068; stroke-width: 2.5; fill: none; marker-end: url(#ah); }
      .flowo { stroke: #ff5c00; stroke-width: 3; fill: none; marker-end: url(#ao); }
      .box { fill: #ffffff; stroke: #d9dbe3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="20" y="44" class="serif" font-size="32" fill="#0d0f1a">Where a person sits in a staged change</text>
  <text x="20" y="76" class="sans l">The agent's road ends at propose. Only the orange step reaches apply for anything that moves money.</text>

  <!-- lanes -->
  <text x="20" y="160" class="sans k">AGENT</text>
  <text x="20" y="326" class="sans k">CODE</text>
  <text x="20" y="492" class="sans k">PERSON</text>
  <line x1="20" y1="235" x2="980" y2="235" stroke="#eef0f5" stroke-width="2"/>
  <line x1="20" y1="405" x2="980" y2="405" stroke="#eef0f5" stroke-width="2"/>

  <!-- agent lane -->
  <rect x="120" y="100" width="260" height="110" rx="12" class="box"/>
  <text x="140" y="136" class="sans h">Propose</text>
  <text x="140" y="166" class="sans s">a change set,</text>
  <text x="140" y="192" class="sans s">with a reason</text>

  <rect x="410" y="100" width="240" height="110" rx="12" fill="#faf8f5" stroke="#d9dbe3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="430" y="136" class="sans h" fill="#9ea3b8">Approve</text>
  <text x="430" y="166" class="sans s">no such tool</text>
  <text x="430" y="192" class="sans s">for the agent</text>

  <rect x="690" y="100" width="240" height="110" rx="12" class="box"/>
  <text x="710" y="136" class="sans h">Roll back</text>
  <text x="710" y="166" class="sans s">the agent or you,</text>
  <text x="710" y="192" class="sans s">any time</text>

  <!-- code lane -->
  <rect x="120" y="260" width="290" height="120" rx="12" class="box"/>
  <text x="140" y="296" class="sans h">Policy check</text>
  <text x="140" y="326" class="sans s">allowlisted? reversible?</text>
  <text x="140" y="352" class="sans s">guardrails? preview?</text>

  <rect x="690" y="260" width="240" height="120" rx="12" class="box"/>
  <text x="710" y="296" class="sans h">Apply</text>
  <text x="710" y="326" class="sans s">a rollback handle</text>
  <text x="710" y="352" class="sans s">is recorded first</text>

  <!-- person lane -->
  <rect x="120" y="430" width="300" height="115" rx="12" fill="#fff4ec" stroke="#ff5c00" stroke-width="3"/>
  <text x="140" y="466" class="sans h">You decide</text>
  <text x="140" y="496" class="sans s">money, live or destructive,</text>
  <text x="140" y="522" class="sans s">or the project's default</text>

  <rect x="690" y="430" width="240" height="115" rx="12" class="box"/>
  <text x="710" y="466" class="sans h">Rejected</text>
  <text x="710" y="496" class="sans s">nothing ran</text>

  <!-- flows -->
  <path d="M250 210 L250 258" class="flow"/>
  <path d="M410 316 L688 316" class="flow"/>
  <text x="428" y="302" class="sans s">every change passes</text>
  <text x="428" y="342" class="sans s">and autonomy allows</text>
  <path d="M810 260 L810 212" class="flow"/>
  <text x="822" y="242" class="sans s">if it has one</text>
  <path d="M250 380 L250 428" class="flow"/>
  <text x="262" y="412" class="sans s">anything else</text>
  <path d="M420 470 L688 470" class="flow"/>
  <text x="470" y="460" class="sans s">no</text>
  <path d="M420 510 C560 510 640 430 740 382" class="flowo"/>
  <text x="612" y="426" class="sans s" fill="#c2410c" font-weight="bold">yes</text>
</svg>
