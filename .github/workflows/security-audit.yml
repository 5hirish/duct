name: Security Audit (Advisory)

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  security-audit:
    name: Local policy parity security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit checkov
          npm install -g @semgrep/semgrep gitleaks osv-scanner trivy || true

      - name: Run security audit (deep)
        run: |
          python3 scripts/security/audit.py --mode deep
