name: Security Audit

permissions:
  contents: read

on:
  # No `paths` filter, deliberately: this one is repo-wide. A committed secret
  # or an f-string SQL construction can arrive in any directory, and the check
  # costs minutes rather than the tens of minutes the build jobs do.
  # `edited` dropped for the same reason as everywhere else — a retitled PR is
  # not a new security posture.
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  security-audit:
    name: Local policy parity security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking. scripts/security/audit.py only returns non-zero on CRITICAL
    # findings — everything lower is reported and passes — so a red run here
    # means something worth stopping for. Suppress a known-safe critical by
    # fingerprinting it into .security-audit-baseline.json (`--write-baseline`)
    # with a note, rather than by making this advisory again.
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The previous version of this step installed the scanners with
      # `npm install -g @semgrep/semgrep gitleaks osv-scanner trivy || true`.
      # Three of those four are not npm packages — they 404 — and npm resolves
      # every spec before installing, so the whole command failed and `|| true`
      # swallowed it. gitleaks never landed either, which meant the only check
      # in audit.py that raises CRITICAL had never actually run in CI.
      #
      # Each tool is now installed from where it is really published, and there
      # is no `|| true`: a scanner that cannot be installed should fail the job,
      # not silently downgrade the audit.
      - name: Install security scanners
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit checkov
          # Opengrep, not Semgrep: the LGPL-2.1 community fork restores the
          # taint analysis and interprocedural scanning that Semgrep moved
          # behind its commercial tier, and is governed by a consortium rather
          # than a single vendor. Same flags, same JSON schema.
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # betterleaks is the maintained successor to gitleaks by its original
          # author, and the only scanner whose findings audit.py treats as
          # CRITICAL. It reads .betterleaks.toml, which carries Duct's own rules.
          go install github.com/betterleaks/betterleaks@latest
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      # Runs over every tracked file, not just the diff: a credential added
      # before the hook existed is just as public as one added today.
      # --require so a missing binary fails the job. Locally the same script
      # warns and passes, so a contributor without betterleaks is not blocked.
      - name: Leak scan (betterleaks, tracked files)
        run: python3 scripts/security/leak_scan.py --all --require

      - name: Run security audit (deep)
        run: |
          python3 scripts/security/audit.py --mode deep
