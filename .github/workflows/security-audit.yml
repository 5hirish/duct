name: Security Audit

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  security-audit:
    name: Local policy parity security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking. scripts/security/audit.py only returns non-zero on CRITICAL
    # findings — everything lower is reported and passes — so a red run here
    # means something worth stopping for. Suppress a known-safe critical by
    # fingerprinting it into .security-audit-baseline.json (`--write-baseline`)
    # with a note, rather than by making this advisory again.
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit checkov
          npm install -g @semgrep/semgrep gitleaks osv-scanner trivy || true

      # Runs over every tracked file, not just the diff: a credential added
      # before the hook existed is just as public as one added today. Needs no
      # scanners installed, so it runs even if the step above degrades.
      - name: Leak scan (credentials, private hostnames)
        run: python3 scripts/security/leak_scan.py --all

      - name: Run security audit (deep)
        run: |
          python3 scripts/security/audit.py --mode deep
