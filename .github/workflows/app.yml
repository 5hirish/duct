name: App Checks

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_call:

jobs:
  app-checks:
    name: App install, sanity, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Node version
        id: node-version
        run: |
          if [ -f .nvmrc ]; then
            echo "value=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "value=20" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.value }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Typecheck (if configured)
        run: npm run typecheck --if-present

      - name: Build app
        run: npm run build
