name: App CI/CD

permissions:
  contents: read

on:
  # `edited` is deliberately absent: on `pull_request` it fires when the TITLE
  # or DESCRIPTION changes, so retitling a PR re-ran every job below. `synchronize`
  # already covers new commits, which is the only edit that can change the answer.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    # Only when this area actually changed. Before this, a backend-only PR still
    # paid for a full run here. Filtering the PR trigger and not the `push` one
    # is deliberate — main keeps building and deploying exactly as it does today,
    # so this can only ever remove work from a PR, never from a release.
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
      - 'scripts/i18n/**'
  push:
    branches:
      - main
  workflow_call:

jobs:
  app-checks:
    name: App install, sanity, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve Node version
        id: node-version
        run: |
          if [ -f .nvmrc ]; then
            echo "value=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "value=20" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node-version.outputs.value }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci


      # `lint` stays --if-present: there is no ESLint config in app/ yet, so this
      # is a placeholder, not a gate. `typecheck` was a placeholder too until the
      # script existed — `--if-present` on a missing script exits 0, so the step
      # reported green without ever running tsc. Anything that is actually a gate
      # is invoked by name, so a missing script fails the build instead of
      # quietly passing.
      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # `npm run build` already runs `lingui compile --strict`, which catches a
      # translation that is missing from a catalogue. It cannot catch a string
      # that was never extracted (it renders English in every language) or a
      # literal written outside Lingui, so the full gate runs by name here.
      - name: Interface language (catalogues current, complete, nothing outside Lingui)
        run: npm run check:i18n

      # Brand and product names stay in English in every language, and the
      # glossary (scripts/i18n/glossary.json) is the list. Lingui cannot see it.
      - name: Interface language (translations keep the glossary's brand terms)
        run: python3 ../scripts/i18n/fill.py --check src/locales/*/messages.po

      # The session reducer replayed against recorded agent streams — the
      # lifecycle every workspace runs on, checked without a browser.
      - name: Unit tests (vitest)
        run: npm test

      - name: Slide-renderer parity (slideDoc.js vs backend templates.py)
        run: npm run check:parity

      - name: Build app
        run: npm run build

  # ---------------------------------------------------------------------------
  # The page frame, measured in a browser (app/scripts/check-layout.mjs): every
  # framed screen at a phone, the desktop app's width and a laptop, signed in
  # against the fixture backend. Fails on a page title out of line with the
  # others, a page wider than the window, a header status that wraps, and a
  # row of cards whose footers do not share a baseline — the defects the
  # 2026-11-02 UI audit found by looking, which no source check can see.
  # Its own job so the main checks do not wait on a build and a browser.
  # ---------------------------------------------------------------------------
  app-layout:
    name: App layout (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve Node version
        id: node-version
        run: |
          if [ -f .nvmrc ]; then
            echo "value=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "value=20" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node-version.outputs.value }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            site/package-lock.json

      - name: Install dependencies (app, and site for Playwright)
        run: |
          npm ci
          npm --prefix ../site ci

      - name: Install Playwright browser
        run: npx --prefix ../site playwright install --with-deps chromium

      # The API base is baked in at build time; the check reroutes it to the
      # fixture backend it starts, so nothing here reaches a real server.
      - name: Build app
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8002
        run: npm run build

      - name: Check the page frame in a browser
        run: |
          npx next start -p 3003 > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3003/ && break
            sleep 1
          done
          npm run check:layout

  # ---------------------------------------------------------------------------
  # Deploy the Worker (OpenNext → wrangler) on merge to main, only after the
  # checks above pass. Replaces the Cloudflare "Workers Builds" git integration,
  # which failed because its Node 20 builder can't run wrangler@4.99 (needs >=22;
  # pinned via app/.nvmrc). Disable that integration so this is the only deploy.
  #
  # Repo secrets used: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Workers R2
  # Storage:Edit, Account Settings:Read), CLOUDFLARE_ACCOUNT_ID, and the build-time
  # NEXT_PUBLIC_* vars (inlined into the client bundle).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare Workers
    needs: app-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-app
      cancel-in-progress: false

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve Node version
        id: node-version
        run: |
          if [ -f .nvmrc ]; then
            echo "value=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "value=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.node-version.outputs.value }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js → OpenNext → Cloudflare)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Identifies this deployment to a tab that loaded an older one, so
          # ReloadToast can offer a refresh instead of letting the tab break on
          # a chunk that no longer exists. Baked in, so it must be set here
          # rather than in the Cloudflare dashboard.
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_DUCT_API_KEY: ${{ secrets.NEXT_PUBLIC_DUCT_API_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # The public project token (phc_…), a repository variable rather than
          # a secret because every browser receives it anyway. Unset, the build
          # measures nothing and reports no errors.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          # Source maps for readable stack traces. Unlike the token this is a
          # personal key with write access, so it is a secret; unset, the build
          # skips the upload (next.config.mjs) and the reports name minified
          # chunks.
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
