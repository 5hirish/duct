name: desktop — compile check

# The question a pull request can actually answer about the desktop shell:
# does the Rust compile.
#
# `desktop-release.yml` used to run on PRs and asked a different one. Every job
# there ends in signing and publishing, so a PR without the release secrets saw
# all three platforms fail whatever the code did — three red checks, one of them
# twenty-five minutes of Windows runner, none of them about the diff. Releases
# now happen on main only; this is what stays behind.
#
# One platform, not three. The shell is the same Rust either way, and a type
# error does not respect an OS boundary — the per-platform work is bundling,
# which is precisely what is deliberately not happening here.
#
# `cargo check`, not `cargo build`: it type-checks the crate and its
# dependencies without linking or codegen, which is most of the signal for a
# fraction of the time. It does still need the sidecar path to exist, which is
# not the same as needing a sidecar — see the stub step below.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'desktop/**'
      - '!desktop/**.md'
      - '.github/workflows/desktop-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri
          # The first green run is what populates this cache, and a red one
          # still paid the full dependency compile. Keeping it means a failure
          # costs one contributor thirteen minutes rather than every one after.
          cache-on-failure: true

      # The same set desktop-release.yml installs, and for the same reasons:
      # libwebkit2gtk-4.1 is Tauri v2's webview and libsoup-3.0 rides with it,
      # libdbus-1 is what the `keyring` crate's secret-service backend links
      # against. `patchelf` and `librsvg2` are bundling-time tools, so they are
      # not here.
      - name: Install Tauri system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev

      # This job used to stub backend/dist/duct-sidecar before checking, because
      # tauri-build validates every `bundle.resources` path from inside build.rs
      # and the crate would not type-check without it — `cargo check` panicked
      # with "resource path doesn't exist" before reading a line of our Rust.
      # The default config declares no resources any more, so there is nothing
      # to stub. If a `bundle.resources` entry ever comes back to
      # tauri.conf.json, this job breaks in that confusing way again and the
      # stub is the fix.
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked --all-targets
