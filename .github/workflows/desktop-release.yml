name: desktop — release (macOS, Windows, Linux)

# Builds the Tauri desktop shell for all three desktop platforms and publishes a
# GitHub Release carrying the updater manifest.
#
# The shell is a thin client: it renders app.getduct.ai and talks to the hosted
# API. It used to ship the FastAPI backend frozen by PyInstaller as a ~400 MB
# bundled resource; that is gone, along with the per-platform Python freeze, the
# nested Mach-O signing pass and roughly twenty minutes of every run.
#
# This still runs in CI rather than on a laptop because Windows and Linux
# bundles cannot be produced on a Mac — and standard runners are free on a
# public repository, so there is nothing to save by moving it.
#
# This is now the only desktop channel. The Mac App Store one was retired: its
# sandbox cannot host the sidecar, so it was stuck shipping the pre-sidecar thin
# client, and keeping it alive cost three config files, a workflow and a cargo
# feature whose only job was to strip the updater for Apple. Reasoning for why
# it could never carry the sidecar: the engine consolidation review (duct-cloud,
# private) §8.
#
# macOS signing order is the part that most often goes wrong. A PyInstaller
# onedir tree contains hundreds of Mach-O files (.so extension modules, dylibs,
# the bootloader). Under the hardened runtime every one must carry a valid
# signature, and they must be signed *before* the enclosing .app, innermost
# first — signing the app afterwards seals what is already inside it.
# `codesign --deep` is deprecated by Apple and does not reliably do this, so the
# nested pass below is explicit.
#
# REQUIRED GitHub secrets:
#   macOS (Developer ID + notarization)
#     DUCT_DEVID_CERT_P12          base64 of the "Developer ID Application" .p12
#     DUCT_DEVID_CERT_PASSWORD     password for that .p12
#     DUCT_DEVID_IDENTITY          e.g. "Developer ID Application: Duct (ABCDE12345)"
#     DUCT_APPLE_TEAM_ID           10-char Apple Team ID
#     DUCT_NOTARY_APPLE_ID         Apple ID email used for notarization
#     DUCT_NOTARY_PASSWORD         app-specific password for that Apple ID
#   All platforms (self-update)
#     TAURI_SIGNING_PRIVATE_KEY    contents of the minisign private key
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   All platforms (crash reporting)
#     SENTRY_DSN                   same DSN the backend uses. Compiled into the
#                                  shell by `option_env!`, so like the OAuth
#                                  secret below it must be on every step that
#                                  runs `tauri build`. Absent is fine: the shell
#                                  simply never reports, and the settings toggle
#                                  hides itself.
#   Optional
#     ANTHROPIC_API_KEY            writes the changelog on the release page and
#                                  in the updater dialog. Absent is fine: the
#                                  notes fall back to the list of commit
#                                  subjects, which is what they were before.
#                                  Costs a fraction of a cent per release.
#   All platforms (sign-in)
#     GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET
#                                  secret of the Google *Desktop app* OAuth client
#                                  whose id defaults in src/sidecar.rs and can be
#                                  overridden by GOOGLE_DESKTOP_OAUTH_CLIENT_ID
#                                  (a fork sets both). Same names the backend
#                                  reads and backend/.env.local uses — one value,
#                                  one spelling.
#
# GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET is read by `option_env!` while rustc compiles, not at
# runtime, so it must be present on every step that invokes `tauri build` — the
# DMG step included. Leaving it off one step is worse than leaving it off all of
# them: build.rs declares `rerun-if-env-changed`, so a set-then-unset sequence
# recompiles the binary with no secret and the bundle silently ships that. When
# it is absent everywhere, the app builds and installs fine and fails only when a
# user taps Sign in with Google - no test covers this, on purpose (there is
# nothing to assert without a live Google round-trip).
#
# The updater key is NOT the code-signing certificate. Losing it means shipping
# an update no installed copy will accept — installs would have to be replaced
# by hand. Keep it backed up outside CI.

on:
  # Releases happen on main. Nowhere else.
  #
  # This used to run on pull requests too, on the reasoning that desktop changes
  # should build where the risk lives. In practice it asked a PR a question a PR
  # cannot answer: every job here ends in signing and publishing, so without the
  # release secrets all three platforms failed on every PR regardless of whether
  # the code was sound — twenty-five minutes of Windows runner to learn nothing.
  # `desktop-check.yml` covers the part a PR *can* answer: does it compile.
  #
  # Runner cost is not the reason — standard runners are free on a public repo,
  # macOS included, and dropping the sidecar took a run from ~25 minutes to ~5.
  # The reason is that a release is a published, signed, immutable artifact, and
  # a branch has no business minting one.
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '!desktop/**.md'
      - '.github/workflows/desktop-release.yml'
      # `backend/**` used to be here, because the bundle shipped the backend
      # frozen by PyInstaller — a backend fix reached users only through a new
      # installer. It no longer does: the shell talks to the hosted API, so
      # backend changes reach every desktop user the moment Railway deploys,
      # and rebuilding installers for them would republish the same version
      # with different bytes.
  workflow_dispatch:
    inputs:
      allow_overwrite:
        description: >-
          Republish over an already-released version. Only for recovering a run
          that died after creating the release — it replaces assets people may
          already have downloaded.
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS — Developer ID, notarized, DMG
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (Developer ID DMG, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      # Both arches, because this build is universal2 — which is only affordable
      # now that the bundle is a small Rust binary. With the PyInstaller sidecar
      # in it, a universal build meant two full CPython trees (~600 MB) and Intel
      # Macs were offered nothing at all.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DUCT_DEVID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DUCT_DEVID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/devid-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$RUNNER_TEMP/devid.p12"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # One pass: sign, notarize, staple, package. This used to be four steps —
      # build the .app, walk the sidecar signing hundreds of nested Mach-O files
      # innermost-first, re-seal the app, then notarize by hand with notarytool
      # because Tauri's own notarization ran before that re-signing. None of it
      # is needed now that the bundle holds no nested binaries: Tauri signs the
      # one executable it built and notarizes it itself when APPLE_ID,
      # APPLE_PASSWORD and APPLE_TEAM_ID are present.
      #
      # `--bundles dmg,updater` also produces the Duct.app.tar.gz + .sig pair the
      # updater consumes, because bundle.createUpdaterArtifacts is on. The .app
      # is built as part of this (no --no-bundle-app), so the tarball carries the
      # notarized bundle.
      - name: Build, sign, notarize and package
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.DUCT_DEVID_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.DUCT_APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.DUCT_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.DUCT_NOTARY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg,updater

      # A universal binary that is not actually universal still runs fine on the
      # runner, so nothing else here would catch it — and the people it fails for
      # are exactly the Intel users this build exists to reach.
      - name: Verify the bundle is universal and stapled
        run: |
          set -euo pipefail
          APP="desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Duct.app"
          lipo -archs "$APP/Contents/MacOS/Duct"
          lipo -archs "$APP/Contents/MacOS/Duct" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/Duct" | grep -q arm64
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-macos
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: error

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/devid-signing.keychain-db" || true

  # ---------------------------------------------------------------------------
  # Linux — deb + AppImage
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (deb + AppImage)
    # Pinned, not `-latest`: the glibc the runner links against sets the oldest
    # distro the AppImage will start on, so moving up silently drops users.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      # libwebkit2gtk-4.1 is Tauri v2's webview. libsoup-3.0 comes with it.
      # libdbus-1 is what the `keyring` crate's secret-service backend talks to,
      # and is a build-time requirement even though the *daemon* is a runtime one.
      - name: Install Tauri system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Build bundles
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The AppImage bundler downloads linuxdeploy and runs it, which needs
          # FUSE — and a GitHub runner has no /dev/fuse. This is the documented
          # way around it; installing `fuse` is not enough.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run tauri -- build --bundles deb,appimage,updater

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows — NSIS installer
  # ---------------------------------------------------------------------------
  #
  # NOT code-signed: that needs an Authenticode certificate, which we do not have
  # yet. Until then SmartScreen shows an "unrecognised app" warning on first run.
  # Signing slots in here later via Tauri's `windows.signCommand`.
  windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Build bundles
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_OAUTH_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run tauri -- build --bundles nsis,updater

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.nsis.zip
            desktop/src-tauri/target/release/bundle/nsis/*-setup.nsis.zip.sig
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish — one release carrying every platform's bundle + latest.json
  # ---------------------------------------------------------------------------
  #
  # `latest.json` is the manifest the updater polls (see the `endpoints` in
  # tauri.conf.json). It has to be assembled here rather than by any single
  # platform job, because it names the artifact and signature for all three.
  publish:
    name: Publish release
    needs: [macos, linux, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The changelog is the commit range since the previous `desktop-v*`
          # tag, so this job needs the tags and the history behind them. The
          # default single-commit clone has neither, and the failure is silent:
          # an empty range produces empty notes, not an error.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install the Anthropic SDK
        run: pip install --quiet 'anthropic>=1,<2'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Read the shell version
        id: version
        run: |
          set -euo pipefail
          # tauri.conf.json and Cargo.toml are required to match (desktop/CLAUDE.md).
          VERSION="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          CARGO="$(grep -m1 '^version = ' desktop/src-tauri/Cargo.toml | cut -d'"' -f2)"
          if [ "$VERSION" != "$CARGO" ]; then
            echo "version mismatch: tauri.conf.json=$VERSION Cargo.toml=$CARGO" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A released version is immutable. Without this, a second push at the same
      # version re-runs the build and `--clobber`s the assets: the tag still
      # points at the old commit, the notarized DMG under it is now a different
      # binary, and no installed copy updates because the version string never
      # moved. Two people who both "downloaded 0.4.0" would have different apps.
      #
      # Failing loudly here is the point — the fix is a version bump, and the
      # alternative (skipping quietly) trains everyone to ignore a green run
      # that published nothing.
      #
      # The escape hatch is a `workflow_dispatch` input rather than an env flag,
      # so overwriting a public release is a deliberate click with a name on it.
      - name: Refuse to overwrite a published version
        if: inputs.allow_overwrite != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="desktop-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already published. Bump the version in" \
                 "desktop/src-tauri/tauri.conf.json and Cargo.toml (they must match)," \
                 "or re-run from the Actions tab with allow_overwrite to recover a" \
                 "half-finished release." >&2
            exit 1
          fi

      # Scoped to `desktop` and `backend` because those are the two trees that
      # end up inside the bundle — and, not by coincidence, the two that trigger
      # this workflow. A change to `app/` deploys continuously and reaches an
      # installed copy without an update, so listing it here would credit this
      # release with something it does not carry.
      - name: Collect the commits since the last desktop release
        id: commits
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Highest version first, minus the tag this run is about to create or
          # overwrite — on a re-run of the same version that tag already exists
          # and would make the range empty.
          PREV="$(git tag --list 'desktop-v*' --sort=-v:refname \
                    | grep -vx "desktop-v$VERSION" | head -n1 || true)"

          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
          else
            # First release: everything, which is the honest answer.
            RANGE="HEAD"
          fi

          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "range: $RANGE"

          # Subject on a `* ` line, body indented under it — release_notes.py's
          # fallback path reads that shape to recover the bare subject list.
          git log --no-merges --format='* %s%n%w(0,2,2)%b' "$RANGE" \
            -- desktop backend > commits.txt
          wc -l commits.txt

      - name: Write the changelog
        env:
          # Absent is fine. The script falls back to the plain commit list
          # rather than failing, so a missing key costs prose, never a release.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py \
            --version "$VERSION" --log-file commits.txt > notes.md
          cat notes.md

      # The written part stops at notes.md. Everything below is assembled here,
      # deterministically, because a download instruction the model got subtly
      # wrong is worse than no download instruction at all.
      - name: Assemble the release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.commits.outputs.previous }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            cat notes.md
            echo
            echo "### Which file do I want"
            echo
            echo "- **macOS** — the \`.dmg\`. Apple silicon, signed and notarised."
            echo "- **Windows** — the \`-setup.exe\`."
            echo "- **Linux** — the \`.AppImage\` to just run it, or the \`.deb\` to install it."
            echo
            echo "The \`.tar.gz\`, \`.nsis.zip\`, \`.sig\` and \`latest.json\` files belong to the"
            echo "in-app updater. An installed copy finds them on its own — you do not need them."
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog**: https://github.com/$REPO/compare/$PREV...desktop-v$VERSION"
            fi
          } > body.md
          cat body.md

      - name: Assemble latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The same notes the release page shows, minus the download section —
          # the updater's dialog is offering a file, not asking you to pick one.
          node .github/scripts/build-updater-manifest.mjs \
            --version "$VERSION" \
            --artifacts artifacts \
            --repo "$REPO" \
            --notes-file notes.md \
            --out latest.json
          cat latest.json

      # What getduct.ai/download reads. Published as a release asset so the site
      # can link to `releases/latest/download/downloads.json` — one URL that
      # never changes while the installer filenames behind it do.
      - name: Assemble downloads.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node .github/scripts/build-downloads-manifest.mjs \
            --version "$VERSION" \
            --artifacts artifacts \
            --repo "$REPO" \
            --out downloads.json
          cat downloads.json

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="desktop-v$VERSION"

          # Collect into an array rather than interpolating `$(find ...)`, which
          # word-splits on any bundle name containing a space.
          mapfile -d '' ASSETS < <(find artifacts -type f -print0)
          ASSETS+=(latest.json downloads.json)

          # Re-running a build for the same version replaces the assets rather
          # than failing; the updater reads whatever `latest` points at. The
          # notes are rewritten too — a re-run usually means the first attempt
          # published something wrong, and stale notes are part of that.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
            gh release edit "$TAG" --notes-file body.md
          else
            gh release create "$TAG" \
              --title "Duct Desktop $VERSION" \
              --notes-file body.md \
              "${ASSETS[@]}"
          fi
