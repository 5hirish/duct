name: Site Checks

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_call:

jobs:
  validate:
    name: Validate HTML pages & sitemap
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🔎 Check HTML page requirements"
        run: python3 .github/scripts/check-pages.py

      - name: "📋 Validate sitemap.xml"
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import pathlib
          import sys

          sitemap_path = pathlib.Path('site/sitemap.xml')
          if not sitemap_path.exists():
              print(f'ERROR: missing sitemap at {sitemap_path}')
              sys.exit(1)

          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [u.find('sm:loc', ns).text for u in root.findall('sm:url', ns)]
          print(f'{sitemap_path}: valid XML, {len(urls)} URLs')

          # Every entry should have a non-empty <loc>
          bad = [u for u in urls if not u or not u.startswith('https://getduct.ai')]
          if bad:
              print('ERROR: bad <loc> entries:', bad)
              sys.exit(1)

          print('All sitemap <loc> values look correct.')
          EOF

  playwright-smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: "📦 Install site test dependencies"
        run: npm --prefix site ci

      - name: "🎭 Install Playwright browser"
        run: npx --prefix site playwright install --with-deps chromium

      - name: "🧪 Run site smoke tests"
        run: npm --prefix site run test:e2e

      - name: "🧾 Upload Playwright artifacts"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-site-artifacts
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore

