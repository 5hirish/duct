name: Site Checks

permissions:
  contents: read

on:
  # `edited` is deliberately absent: on `pull_request` it fires when the TITLE
  # or DESCRIPTION changes, so retitling a PR re-ran every job below. `synchronize`
  # already covers new commits, which is the only edit that can change the answer.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    # Only when this area actually changed. Before this, a backend-only PR still
    # paid for a full run here. Filtering the PR trigger and not the `push` one
    # is deliberate — main keeps building and deploying exactly as it does today,
    # so this can only ever remove work from a PR, never from a release.
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches:
      - main
  workflow_call:

jobs:
  site:
    name: Validate HTML, sitemap, and Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "📝 Check generated blog pages are current"
        run: python3 scripts/build_blog.py --check

      - name: "🔎 Check HTML page requirements"
        run: python3 .github/scripts/check-pages.py

      - name: "📋 Validate sitemap.xml and blog feed"
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import pathlib
          import sys

          sitemap_path = pathlib.Path('site/sitemap.xml')
          if not sitemap_path.exists():
              print(f'ERROR: missing sitemap at {sitemap_path}')
              sys.exit(1)

          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [u.find('sm:loc', ns).text for u in root.findall('sm:url', ns)]
          print(f'{sitemap_path}: valid XML, {len(urls)} URLs')

          # Every entry should have a non-empty <loc>
          bad = [u for u in urls if not u or not u.startswith('https://getduct.ai')]
          if bad:
              print('ERROR: bad <loc> entries:', bad)
              sys.exit(1)

          print('All sitemap <loc> values look correct.')

          feed_path = pathlib.Path('site/blog/feed.xml')
          if not feed_path.exists():
              print(f'ERROR: missing feed at {feed_path}')
              sys.exit(1)
          feed = ET.parse(feed_path).getroot()
          items = feed.findall('.//item')
          if not items:
              print('ERROR: feed.xml has no <item> entries')
              sys.exit(1)
          for item in items:
              link = item.find('link')
              if link is None or not (link.text or '').startswith('https://getduct.ai'):
                  print('ERROR: feed item with a missing or off-domain <link>')
                  sys.exit(1)
          print(f'{feed_path}: valid RSS, {len(items)} items')
          EOF

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: "📦 Install site test dependencies"
        run: npm --prefix site ci

      - name: "🎭 Install Playwright browser"
        run: npx --prefix site playwright install --with-deps chromium

      - name: "🧪 Run site smoke tests"
        run: npm --prefix site run test:e2e

      - name: "🧾 Upload Playwright artifacts"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-site-artifacts
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Publish site/ to Cloudflare Pages on merge to main, only after the checks
  # above pass. Replaces the Pages *git integration*, for the same reason app.yml
  # replaced Workers Builds: that integration decides whether to build from
  # "Build watch paths", a dashboard-only setting no one can review, that is not
  # in this repository, and that silently stopped matching `site/**`. A skipped
  # build reports as "skipped", which reads like "nothing to do" rather than
  # "your deploy is broken" — so the site served a pre-September build for days
  # while every workflow here stayed green.
  #
  # Path filters belong next to the code they gate. This job cannot skip for a
  # reason that is invisible in the repo: `needs: site` is the only gate, and
  # the push trigger above is deliberately unfiltered on main.
  #
  # ONE MANUAL STEP: disable the Pages git integration for this project
  # (Workers & Pages → the project → Settings → Builds → disconnect / pause),
  # or every push deploys twice and the two race for the production alias.
  #
  # Repo secrets used: CLOUDFLARE_API_TOKEN (Pages:Edit, Account Settings:Read)
  # and CLOUDFLARE_ACCOUNT_ID — both already present for app.yml.
  # Repo variable: CLOUDFLARE_PAGES_PROJECT (defaults to `duct`).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy site to Cloudflare Pages
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-site
      cancel-in-progress: false

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      # `pages deploy` against a name that does not exist creates a second,
      # empty project and reports success — the site would keep serving the old
      # build with nothing here to say why. Fail on the name instead, and print
      # the real ones so the fix is the next thing you read.
      - name: "🔎 Confirm the Pages project exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'duct' }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project list > projects.txt 2>&1 || {
            cat projects.txt >&2
            echo "::error::could not list Pages projects — check CLOUDFLARE_API_TOKEN scopes (Pages:Edit, Account Settings:Read)" >&2
            exit 1
          }
          if ! grep -qE "(^|[[:space:]|])${PROJECT}([[:space:]|]|$)" projects.txt; then
            echo "::error::no Cloudflare Pages project named '${PROJECT}'. Set the CLOUDFLARE_PAGES_PROJECT repo variable to one of the projects listed below." >&2
            cat projects.txt >&2
            exit 1
          fi
          echo "Pages project '${PROJECT}' found."

      - name: "🚀 Deploy to Cloudflare Pages"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'duct' }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy site \
            --project-name "$PROJECT" \
            --branch main \
            --commit-dirty=true
