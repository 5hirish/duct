name: Site Checks

permissions:
  contents: read

on:
  # `edited` is deliberately absent: on `pull_request` it fires when the TITLE
  # or DESCRIPTION changes, so retitling a PR re-ran every job below. `synchronize`
  # already covers new commits, which is the only edit that can change the answer.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    # Only when this area actually changed. Before this, a backend-only PR still
    # paid for a full run here. Filtering the PR trigger and not the `push` one
    # is deliberate — main keeps building and deploying exactly as it does today,
    # so this can only ever remove work from a PR, never from a release.
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches:
      - main
  workflow_call:

jobs:
  site:
    name: Validate HTML, sitemap, and Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v7

      - name: "📝 Check generated blog pages are current"
        run: python3 scripts/build_blog.py --check

      - name: "🔎 Check HTML page requirements"
        run: python3 .github/scripts/check-pages.py

      - name: "📋 Validate sitemap.xml and blog feed"
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import pathlib
          import sys

          sitemap_path = pathlib.Path('site/sitemap.xml')
          if not sitemap_path.exists():
              print(f'ERROR: missing sitemap at {sitemap_path}')
              sys.exit(1)

          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [u.find('sm:loc', ns).text for u in root.findall('sm:url', ns)]
          print(f'{sitemap_path}: valid XML, {len(urls)} URLs')

          # Every entry should have a non-empty <loc>
          bad = [u for u in urls if not u or not u.startswith('https://getduct.ai')]
          if bad:
              print('ERROR: bad <loc> entries:', bad)
              sys.exit(1)

          print('All sitemap <loc> values look correct.')

          feed_path = pathlib.Path('site/blog/feed.xml')
          if not feed_path.exists():
              print(f'ERROR: missing feed at {feed_path}')
              sys.exit(1)
          feed = ET.parse(feed_path).getroot()
          items = feed.findall('.//item')
          if not items:
              print('ERROR: feed.xml has no <item> entries')
              sys.exit(1)
          for item in items:
              link = item.find('link')
              if link is None or not (link.text or '').startswith('https://getduct.ai'):
                  print('ERROR: feed item with a missing or off-domain <link>')
                  sys.exit(1)
          print(f'{feed_path}: valid RSS, {len(items)} items')
          EOF

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: "📦 Install site test dependencies"
        run: npm --prefix site ci

      - name: "🎭 Install Playwright browser"
        run: npx --prefix site playwright install --with-deps chromium

      - name: "🧪 Run site smoke tests"
        run: npm --prefix site run test:e2e

      - name: "🧾 Upload Playwright artifacts"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-site-artifacts
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
