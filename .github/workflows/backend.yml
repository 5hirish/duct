name: Backend Checks

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_call:

jobs:
  backend-checks:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        run: poetry install --with dev

      - name: Ruff
        run: poetry run ruff check server.py agents routes service tests utils

      - name: Pytest
        run: poetry run pytest -q tests
