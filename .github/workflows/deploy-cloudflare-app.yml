# Deploy Next.js (OpenNext) from app/ to Cloudflare Workers.
# Requires GitHub repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Requires GitHub repo Variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_API_BASE, NEXT_PUBLIC_APP_URL (inlined at build time)
# Optional: NEXT_PUBLIC_GTM_ID (GA4 and other tags configured in GTM)
#
# Docs: docs/engineering/deployment-cloudflare-railway.md

name: Deploy Cloudflare App

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-cloudflare-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-app
  cancel-in-progress: true

jobs:
  deploy:
    name: OpenNext build and wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Node version
        id: node-version
        run: |
          if [ -f app/.nvmrc ]; then
            echo "value=$(tr -d '[:space:]' < app/.nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "value=20" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.value }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies and OpenNext build
        working-directory: app
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
        run: |
          npm ci
          npx opennextjs-cloudflare build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
