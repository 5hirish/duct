name: Content Agent Eval

# Manual-only: this runs the REAL v3 content agent (Claude Agent SDK) end to end
# — it drafts a post, generates every slide image via Gemini, and has a Claude
# judge (vision) score the result. It costs money and needs a database, so it is
# never wired to pull_request / push. Trigger it from the Actions tab when you
# want to check the content agent against the rubric (e.g. before/after a prompt
# or model change, to catch output degradation).
#
# Required repository secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  — drives both the agent and the judge (reused).
#   GEMINI_API_KEY           — slide image generation.
#   EVAL_DATABASE_URL        — a scratch Postgres the eval can read/write.
# Optional:
#   ANTHROPIC_API_KEY        — if set, the judge prefers it over the OAuth token.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-eval:
    name: v3 content e2e + judge
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        # The Agent SDK spawns the `claude` binary as a subprocess.
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        run: poetry install --with dev

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
        run: poetry run python scripts/migrations.py upgrade head

      - name: Run content agent eval
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          DUCT_EVAL_OUTPUT: eval-scorecard.json
        # -s so the rendered scorecard prints; the test also appends it to the
        # GitHub step summary and writes eval-scorecard.json.
        run: poetry run pytest -m live tests/test_content_post_e2e.py -s -v

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-eval-scorecard
          path: backend/eval-scorecard.json
          if-no-files-found: ignore
