[project]
name = "tiktok-research-mcp"
version = "0.1.0"
description = "Global MCP server for TikTok research & discovery via Apify (keyword / hashtag / URL search + on-demand media)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
tiktok-research-mcp = "tiktok_research_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_research_mcp"]
